<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agregar Curso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2> Nuevo Curso</h2>
        <form th:action="@{/cursos/guardar}"
            th:object="${curso}"
            method="post"
            class="col-md-6">

            <div class="mb-3">
                <label class="form-label" for="nombre">Nombre</label>
                <input id="nombre"
                    type="text"
                    th:field="*{nombre}"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="descripcion">Descripción</label>
                <textarea id="descripcion"
                        th:field="*{descripcion}"
                        class="form-control"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label" for="fechaInicio">Fecha de inicio</label>
                <input id="fechaInicio"
                    type="date"
                    th:field="*{fechaInicio}"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="fechaFin">Fecha de finalización</label>
                <input id="fechaFin"
                    type="date"
                    th:field="*{fechaFin}"
                    class="form-control"
                    required>
            </div>
            <div class="text-danger"
                th:if="${#fields.hasErrors('fechaFin')}"
                th:errors="*{fechaFin}">
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/cursos}" class="btn btn-secondary">Cancelar</a>
        </form>
</body>
</html>
