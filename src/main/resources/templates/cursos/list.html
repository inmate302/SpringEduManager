<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SpringEduManager - Cursos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments::header}"></div>
    <div th:replace="~{fragments::nav.dashboard-nav}"></div>

    <h2>Cursos</h2>
    
    <!-- Only Admins see the 'Add' button -->
    <div sec:authorize="hasRole('ADMIN')" class="mb-3">
        <a th:href="@{/cursos/nuevo}" class="btn btn-primary">Nuevo Curso</a>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Fecha de inicio</th>
                <th>Fecha de término</th>
                <th sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="curso : ${cursos}">
                <td th:text="${curso.nombre}">Nombre</td>
                <td th:text="${curso.descripcion}">Descripción</td>
                <td th:text="${curso.fechaInicio}">Fecha de inicio</td>
                <td th:text="${curso.fechaFin}">Fecha de término</td>
                <td sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/cursos/eliminar/{id}(id=${curso.id})}"
                        method="post"
                        style="display: inline;">

                       <button type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Está seguro de que desea borrar este curso?');">
                        Borrar
                    </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
