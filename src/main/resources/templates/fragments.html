<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="navbar">
        <h1> SpringEduManager</h1>
        <div class="user-info">
            <h2>Bienvenido/a, <span class="username"><strong th:text="${username}"></strong></span></h2>
        </div>
    </div>
</header>
<nav class="dashboard-nav">
    <div class="nav-left">
      <a class="nav-btn" href="/dashboard">Inicio</a>
      <a class="nav-btn" href="/cursos">Cursos</a>
      <a sec:authorize="hasRole('ADMIN')" class="nav-btn" href="/estudiantes">Estudiantes</a>
      <a class="nav-btn" href="/evaluaciones">Evaluaciones</a>
    </div>
    <div class="nav-right">
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="nav-btn logout-btn">Cerrar sesión</button>
        </form>
    </div>
</nav>
</body>
</html>
