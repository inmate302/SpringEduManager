<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SpringEduManager - Evaluaciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments::header}"></div>
    <div th:replace="~{fragments::nav.dashboard-nav}"></div>
    <h2>Evaluaciones</h2>
    
    <!-- Only Admins see the 'Add' button -->
    <div sec:authorize="hasRole('ADMIN')" class="mb-3">
        <a th:href="@{/evaluaciones/nuevo}" class="btn btn-primary">Agregar Evaluación</a>
    </div>

    <div class="alert alert-warning"
        th:if="${param.error}"
        th:text="'Debes crear al menos un curso antes de registrar una evaluación'">
    </div>

    <form th:action="@{/evaluaciones}" method="get" class="mb-3">

        <label for="cursoId" class="form-label">
            Seleccionar curso
        </label>

        <select id="cursoId"
                name="cursoId"
                class="form-select"
                onchange="this.form.submit()">

            <option value="">Todos los cursos</option>

            <option th:each="curso : ${cursos}"
                    th:value="${curso.id}"
                    th:text="${curso.nombre}"
                    th:selected="${curso.id == cursoSeleccionadoId}">
            </option>
        </select>
    </form>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Objetivo</th>
                <th>Fecha de entrega</th>
                <th sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="evaluacion : ${evaluaciones}">
                <td th:text="${evaluacion.nombre}">Nombre</td>
                <td th:text="${evaluacion.descripcion}">Descripción</td>
                <td th:text="${evaluacion.objetivo}">Objetivo</td>
                <td th:text="${evaluacion.fecha}">Fecha de entrega</td>
                <td sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/evaluaciones/eliminar/{id}(id=${evaluacion.id})}"
                        method="post"
                        style="display: inline;">

                       <button type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Está seguro de que desea borrar esta evaluación?');">
                        Borrar
                    </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
  <!--<div th:replace="~{fragments::calificaciones}"></div>-->
</body>
</html>
