<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva evaluación</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

    <h2>Nueva evaluación</h2>

    <form th:action="@{/evaluaciones/guardar}"
          th:object="${evaluacion}"
          method="post"
          class="col-md-8">

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>

            <input id="nombre"
                   type="text"
                   th:field="*{nombre}"
                   class="form-control"
                   maxlength="150"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('nombre')}"
                 th:errors="*{nombre}">
            </div>
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">
                Descripción
            </label>

            <textarea id="descripcion"
                      th:field="*{descripcion}"
                      class="form-control"
                      maxlength="500"
                      rows="3"></textarea>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('descripcion')}"
                 th:errors="*{descripcion}">
            </div>
        </div>

        <div class="mb-3">
            <label for="objetivo" class="form-label">Objetivo</label>

            <textarea id="objetivo"
                      th:field="*{objetivo}"
                      class="form-control"
                      maxlength="300"
                      rows="2"></textarea>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('objetivo')}"
                 th:errors="*{objetivo}">
            </div>
        </div>

        <div class="mb-3">
            <label for="cursoId" class="form-label">Curso</label>

            <select id="cursoId"
                    th:field="*{cursoId}"
                    class="form-select"
                    required>

                <option value="">Selecciona un curso</option>

                <option th:each="curso : ${cursos}"
                        th:value="${curso.id}"
                        th:text="${curso.nombre}">
                </option>
            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('cursoId')}"
                 th:errors="*{cursoId}">
            </div>
        </div>

        <div class="mb-3">
                <label class="form-label" for="fecha">Fecha de entrega</label>
                <input id="fecha"
                    type="date"
                    th:field="*{fecha}"
                    class="form-control"
                    required>
        </div>

        <button type="submit" class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/evaluaciones}"
           class="btn btn-secondary">
            Cancelar
        </a>
    </form>

</body>
</html>
