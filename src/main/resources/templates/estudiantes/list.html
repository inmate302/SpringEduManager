<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SpringEduManager - Estudiantes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
    <div th:replace="~{fragments::header}"></div>
    <div th:replace="~{fragments::nav.dashboard-nav}"></div>


<body>
    <h2>Estudiantes</h2>
    
    <!-- Only Admins see the 'Add' button -->
    <div sec:authorize="hasRole('ADMIN')" class="mb-3">
        <a th:href="@{/estudiantes/nuevo}" class="btn btn-primary">Nuevo Estudiante</a>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Fecha de Registro</th>
                <th sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="estudiante : ${estudiantes}">
                <td th:text="${estudiante.nombre}">Nombre</td>
                <td th:text="${estudiante.email}">e-mail</td>
                <td th:text="${estudiante.fechaRegistro}">Fecha de registro</td>
                                <td sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/estudiantes/eliminar/{id}(id=${estudiante.id})}"
                        method="post"
                        style="display: inline;">

                       <button type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Está seguro de que desea borrar este estudiante?');">
                        Borrar
                    </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
