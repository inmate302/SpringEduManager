<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - SpringEduManager</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments::header}"></div>
    <div th:replace="~{fragments::nav.dashboard-nav}"></div>
    <div class="container">

        <!-- Summary Section -->
        <div class="summary-section">
            <h2 class="summary-title">📊 Resumen Rápido</h2>
            <div class="summary-item">
                <span class="summary-item-label">Total de Cursos</span>
                <span class="summary-item-value" th:text="${cursos.size()}">0</span>
            </div>
            <div sec:authorize="hasRole('ADMIN')" class="summary-item">
                <span class="summary-item-label">Total de Estudiantes</span>
                <span class="summary-item-value" th:text="${estudiantes.size()}">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-item-label">Total de Evaluaciones</span>
                <span class="summary-item-value" th:text="${evaluaciones.size()}">0</span>
            </div>
        </div>
    </div>
</body>
</html>
