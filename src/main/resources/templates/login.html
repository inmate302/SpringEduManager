<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Edu Manager - Inicio de sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-page">
    <div class="login-container">
            <h1>Spring Edu Manager</h1>
           <h2>Sistema de coordinación Académica</h2><br>

        <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show" role="alert">
            <strong>¡Se ha cerrado sesión correctamente!</strong> Haz cerrado la sesión.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>¡Inicio de sesión fallido!</strong> Usuario o contraseña inválido
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese su correo electrónico" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary btn-login">Iniciar sesión</button>
        </form>

        <div class="test-credentials">
            <small><strong>Credenciales de prueba</strong><br>
            Admin: admin@bootcamp.net / admin2026<br>
            User: alumno@bootcamp.net / 1234</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
